<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Will you go out with me? 💕</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%95%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink-deep: #e23b7d;
    --pink: #ff6aa6;
    --pink-soft: #ffd0e2;
    --pink-bg1: #ffe9f2;
    --pink-bg2: #ffd9ec;
    --ink: #4a3b44;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--pink-bg1), var(--pink-bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 20px;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: min(440px, 92vw);
    min-height: 520px;
    background: #fff;
    border-radius: 32px;
    box-shadow: 0 30px 60px -20px rgba(226, 59, 125, 0.35),
                0 0 0 1px rgba(255, 106, 166, 0.12) inset;
    padding: 44px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }

  .screen { display: none; width: 100%; animation: pop .5s ease both; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  @keyframes pop {
    from { opacity: 0; transform: translateY(14px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }

  .emoji-row { font-size: 38px; letter-spacing: 8px; margin-bottom: 6px; }

  h1 {
    font-family: 'Pacifico', cursive;
    color: var(--pink-deep);
    font-weight: 400;
    line-height: 1.1;
    margin: 10px 0 6px;
    text-shadow: 0 2px 0 var(--pink-soft);
  }
  .big { font-size: clamp(34px, 9vw, 46px); }
  .med { font-size: clamp(28px, 7.5vw, 38px); }

  p.sub { font-size: 16px; color: #8a6c79; margin: 4px 0 26px; font-weight: 600; }
  p.status { font-size: 14px; font-weight: 600; min-height: 18px; margin: 12px 0 0; }
  p.status.err { color: #e23b7d; }
  p.status.ok { color: #2e9e6b; }

  /* Buttons */
  .btn {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 18px;
    border: none;
    cursor: pointer;
    border-radius: 999px;
    padding: 15px 34px;
    transition: transform .15s ease, box-shadow .2s ease, background .2s;
  }
  .btn-yes {
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    color: #fff;
    box-shadow: 0 10px 22px -6px rgba(226, 59, 125, 0.6);
  }
  .btn-yes:hover { transform: translateY(-2px) scale(1.04); }
  .btn-yes:active { transform: scale(.98); }

  .btn-ghost {
    background: #fdeef4;
    color: #b06384;
    box-shadow: 0 4px 10px -4px rgba(176, 99, 132, 0.3);
  }

  .choice-row {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
    margin-top: 14px;
    min-height: 64px;
    position: relative;
    width: 100%;
  }

  /* The runaway No button */
  #noBtn {
    background: #f3f4f6;
    color: #9aa0a6;
    box-shadow: 0 4px 10px -4px rgba(0,0,0,.15);
    position: relative;
    z-index: 2;
    white-space: nowrap;   /* never wrap to a second line */
  }
  #noBtn.loose { position: fixed; margin: 0; z-index: 50; }

  /* Date picker */
  .date-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    margin-top: 10px;
  }
  input[type="date"], input[type="email"] {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    border: 2px solid var(--pink-soft);
    background: #fff7fb;
    border-radius: 16px;
    padding: 14px 18px;
    width: 100%;
    text-align: center;
    outline: none;
  }
  input[type="email"] { font-size: 16px; }
  input[type="date"]:focus, input[type="email"]:focus { border-color: var(--pink); }

  /* Activity grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin: 6px 0 22px;
  }
  .opt {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 15px;
    background: #fff;
    border: 2px solid var(--pink-soft);
    border-radius: 16px;
    padding: 16px 10px;
    cursor: pointer;
    transition: all .15s ease;
    color: var(--ink);
  }
  .opt:hover { border-color: var(--pink); transform: translateY(-2px); }
  .opt.sel {
    background: linear-gradient(135deg, #fff0f6, #ffe0ee);
    border-color: var(--pink-deep);
    box-shadow: 0 8px 18px -8px rgba(226,59,125,.5);
  }

  .summary {
    background: #fff7fb;
    border: 2px dashed var(--pink-soft);
    border-radius: 18px;
    padding: 18px;
    width: 100%;
    margin-bottom: 22px;
    font-weight: 600;
  }
  .summary b { color: var(--pink-deep); }
  .summary .line { margin: 6px 0; }

  .float-hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
  .fh {
    position: absolute;
    font-size: 22px;
    animation: rise linear forwards;
    opacity: .9;
  }
  @keyframes rise {
    from { transform: translateY(0) scale(.6); opacity: .9; }
    to   { transform: translateY(-110vh) scale(1.2); opacity: 0; }
  }

  .credit { position: fixed; bottom: 10px; width: 100%; text-align: center; left: 0;
            font-size: 12px; color: #d98bb0; font-weight: 600; }
</style>
</head>
<body>
  <div class="card" id="card">

    <!-- Screen 1: Proposal -->
    <section class="screen active" id="s1">
      <div class="emoji-row">💌💕</div>
      <h1 class="big">Will you go<br/>out with me?</h1>
      <div class="choice-row" id="choiceRow">
        <button class="btn btn-yes" id="yesBtn">Yes</button>
        <button class="btn btn-ghost" id="noBtn">No</button>
      </div>
    </section>

    <!-- Screen 2: Yay -->
    <section class="screen" id="s2">
      <div class="emoji-row">💖✨💖</div>
      <h1 class="big">Yay!</h1>
      <p class="sub">I'm so glad you said yes.</p>
      <button class="btn btn-yes" data-go="3">Press to continue</button>
    </section>

    <!-- Screen 3: Pick a date -->
    <section class="screen" id="s3">
      <div class="emoji-row">📅💜</div>
      <h1 class="med">Pick a date</h1>
      <p class="sub">Choose the day for our cute little plan.</p>
      <div class="date-wrap">
        <input type="date" id="dateInput" />
        <button class="btn btn-yes" id="dateContinue">Continue</button>
      </div>
    </section>

    <!-- Screen 4: Activity -->
    <section class="screen" id="s4">
      <div class="emoji-row">🍿🍝🌸</div>
      <h1 class="med">What would you<br/>like to do?</h1>
      <div class="grid" id="grid">
        <button class="opt">Dinner date 🍽️</button>
        <button class="opt">Movie night 🍿</button>
        <button class="opt">Coffee &amp; walk ☕</button>
        <button class="opt">Picnic 🌸</button>
        <button class="opt">Mini golf ⛳</button>
        <button class="opt">Surprise me 🎁</button>
      </div>
      <input type="email" id="userEmail" placeholder="Your email 💌" autocomplete="email" required style="margin-bottom:14px" />
      <button class="btn btn-yes" id="lockIn">Lock it in</button>
      <p class="status" id="submitStatus"></p>
    </section>

    <!-- Screen 5: Confirmed -->
    <section class="screen" id="s5">
      <div class="emoji-row">💗🎉💗</div>
      <h1 class="med">It's a date!</h1>
      <div class="summary">
        <div class="line">📆 <b id="sumDate">—</b></div>
        <div class="line">✨ <b id="sumAct">—</b></div>
      </div>
      <p class="sub" style="margin-bottom:18px">A confirmation is on its way to your inbox. Can't wait to see you. 🥹</p>
      <a class="btn btn-yes" id="gcal" href="#" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;margin-bottom:12px">📅 Add to Google Calendar</a>
    </section>

  </div>

  <div class="float-hearts" id="hearts"></div>
  <div class="credit">made with 💕</div>

<script>
  const screens = {
    1: document.getElementById('s1'),
    2: document.getElementById('s2'),
    3: document.getElementById('s3'),
    4: document.getElementById('s4'),
    5: document.getElementById('s5'),
  };
  function show(n) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[n].classList.add('active');
  }

  const state = { date: null, activity: null, email: null };
  const INVITE_EMAIL = 'nabbyafua@gmail.com'; // guest invited on the calendar event
  // Paste the deployed Google Apps Script web-app URL here (see apps-script/README.md).
  const APPS_SCRIPT_URL = 'PASTE_YOUR_WEB_APP_URL_HERE';

  /* ---------- Screen 1: runaway No button (bounces + dodges cursor) ---------- */
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');

  const PAD = 10;                 // keep it off the very edge
  const DODGE_RADIUS = 140;       // how close the cursor can get before it bolts
  const MAX_SPEED = 16;
  const MIN_SPEED = 2.4;          // never fully stops — always drifting around
  let loose = false;
  let dodges = 0;
  let rafId = null;
  const pos = { x: 0, y: 0 };
  const vel = { x: 0, y: 0 };
  const taunts = ['Nope!', 'Try again 😏', 'Catch me!', 'Nuh uh', 'Too slow!', 'Really? 🙃', 'Missed me!'];

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function goLoose() {
    if (loose) return;
    loose = true;
    const r = noBtn.getBoundingClientRect();
    pos.x = r.left; pos.y = r.top;
    noBtn.classList.add('loose');
    // Reparent to <body> so position:fixed is relative to the viewport.
    // (An ancestor with any transform — e.g. the screen's entry animation —
    // would otherwise become the containing block and throw off coordinates.)
    document.body.appendChild(noBtn);
    noBtn.style.left = pos.x + 'px';
    noBtn.style.top = pos.y + 'px';
    const ang = Math.random() * Math.PI * 2;
    vel.x = Math.cos(ang) * 5;
    vel.y = Math.sin(ang) * 5;
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function bolt(fromX, fromY) {
    // shove the button directly away from a point (the cursor/touch)
    dodges++;
    const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    let dx = (pos.x + w / 2) - fromX;
    let dy = (pos.y + h / 2) - fromY;
    const dist = Math.hypot(dx, dy) || 1;
    const force = 11;
    vel.x += (dx / dist) * force;
    vel.y += (dy / dist) * force;
    noBtn.textContent = taunts[Math.min(dodges - 1, taunts.length - 1)];
    const scale = Math.min(1 + dodges * 0.1, 2.2);
    yesBtn.style.transform = 'scale(' + scale + ')';
  }

  function tick() {
    const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    const maxX = window.innerWidth - w - PAD;
    const maxY = window.innerHeight - h - PAD;

    pos.x += vel.x;
    pos.y += vel.y;

    // bounce off the walls (clamp pos itself so it can never leave the viewport)
    if (pos.x <= PAD) { pos.x = PAD; vel.x = Math.abs(vel.x); }
    else if (pos.x >= maxX) { pos.x = Math.max(PAD, maxX); vel.x = -Math.abs(vel.x); }
    if (pos.y <= PAD) { pos.y = PAD; vel.y = Math.abs(vel.y); }
    else if (pos.y >= maxY) { pos.y = Math.max(PAD, maxY); vel.y = -Math.abs(vel.y); }
    pos.x = clamp(pos.x, PAD, Math.max(PAD, maxX));
    pos.y = clamp(pos.y, PAD, Math.max(PAD, maxY));

    // gentle damping, but keep it always moving
    vel.x *= 0.98; vel.y *= 0.98;
    let sp = Math.hypot(vel.x, vel.y);
    if (sp > MAX_SPEED) { vel.x = vel.x / sp * MAX_SPEED; vel.y = vel.y / sp * MAX_SPEED; }
    else if (sp < MIN_SPEED) {
      if (sp < 0.001) { const a = Math.random() * Math.PI * 2; vel.x = Math.cos(a); vel.y = Math.sin(a); sp = 1; }
      vel.x = vel.x / sp * MIN_SPEED; vel.y = vel.y / sp * MIN_SPEED;
    }

    noBtn.style.left = pos.x + 'px';
    noBtn.style.top = pos.y + 'px';
    rafId = requestAnimationFrame(tick);
  }

  // Cursor cat-and-mouse: when the pointer gets close, the button flees.
  document.addEventListener('mousemove', function (e) {
    if (!screens[1].classList.contains('active')) return;
    if (!loose) { goLoose(); return; }
    const w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    const cx = pos.x + w / 2, cy = pos.y + h / 2;
    const dist = Math.hypot(cx - e.clientX, cy - e.clientY);
    if (dist < DODGE_RADIUS) bolt(e.clientX, e.clientY);
  });

  // Touch / direct attempts: it darts away instead of being pressed.
  noBtn.addEventListener('touchstart', function (e) {
    e.preventDefault();
    goLoose();
    const t = e.touches[0];
    bolt(t ? t.clientX : pos.x, t ? t.clientY : pos.y);
  }, { passive: false });
  noBtn.addEventListener('mousedown', function (e) { e.preventDefault(); goLoose(); bolt(e.clientX, e.clientY); });
  noBtn.addEventListener('click', function (e) { e.preventDefault(); });

  yesBtn.addEventListener('click', function () {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    loose = false;
    noBtn.classList.remove('loose');
    noBtn.style.display = 'none';  // it lives in <body> now; just retire it
    burstHearts(28);
    show(2);
  });

  /* ---------- continue buttons ---------- */
  document.querySelectorAll('[data-go]').forEach(b => {
    b.addEventListener('click', () => show(parseInt(b.dataset.go, 10)));
  });

  /* ---------- Screen 3: date ---------- */
  const dateInput = document.getElementById('dateInput');
  const today = new Date();
  dateInput.min = today.toISOString().split('T')[0];
  document.getElementById('dateContinue').addEventListener('click', function () {
    if (!dateInput.value) {
      dateInput.style.borderColor = '#e23b7d';
      dateInput.focus();
      return;
    }
    state.date = dateInput.value;
    show(4);
  });

  /* ---------- Screen 4: activity ---------- */
  const grid = document.getElementById('grid');
  grid.addEventListener('click', function (e) {
    const opt = e.target.closest('.opt');
    if (!opt) return;
    grid.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
    opt.classList.add('sel');
    state.activity = opt.textContent.trim();
  });
  const userEmail = document.getElementById('userEmail');
  const lockIn = document.getElementById('lockIn');
  const submitStatus = document.getElementById('submitStatus');
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function setStatus(msg, kind) {
    submitStatus.textContent = msg || '';
    submitStatus.className = 'status' + (kind ? ' ' + kind : '');
  }

  lockIn.addEventListener('click', async function () {
    if (!state.activity) {
      // gently nudge: flash the grid
      grid.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 250 });
      setStatus('Pick something to do first 🙂', 'err');
      return;
    }
    const email = userEmail.value.trim();
    if (!EMAIL_RE.test(email)) {
      userEmail.style.borderColor = '#e23b7d';
      userEmail.focus();
      setStatus('Please enter a valid email so we can confirm 💌', 'err');
      return;
    }
    state.email = email;

    lockIn.disabled = true;
    setStatus('Locking it in… 💕', null);
    try {
      await submitBooking({ date: state.date, activity: state.activity, email: email });
      setStatus('', null);
      goToConfirmation();
    } catch (err) {
      setStatus("Couldn't send the confirmation — please try again.", 'err');
    } finally {
      lockIn.disabled = false;
    }
  });

  function goToConfirmation() {
    const d = new Date(state.date + 'T00:00:00');
    const pretty = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    document.getElementById('sumDate').textContent = pretty;
    document.getElementById('sumAct').textContent = state.activity;
    document.getElementById('gcal').href = buildGCalUrl(state.date, state.activity, INVITE_EMAIL);
    burstHearts(40);
    show(5);
  }

  // POST the booking to the Apps Script web app, which writes to the sheet
  // and emails both the owner and the user via MailApp.
  function submitBooking(payload) {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR_WEB_APP_URL') === 0) {
      // Not configured yet — don't block the happy path during local testing.
      console.warn('APPS_SCRIPT_URL is not set; skipping backend submit.');
      return Promise.resolve();
    }
    // text/plain keeps this a "simple" request (no CORS preflight, which the
    // Apps Script web app does not answer). The script parses the JSON body.
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    }).then(function () { /* opaque response with no-cors; assume success */ });
  }

  userEmail.addEventListener('input', function () {
    userEmail.style.borderColor = '';
    if (submitStatus.classList.contains('err')) setStatus('', null);
  });

  /* ---------- Google Calendar link ---------- */
  function buildGCalUrl(isoDate, activity, email) {
    // All-day event. Google expects dates=YYYYMMDD/YYYYMMDD with the end
    // date exclusive, so the end is the day after the start.
    const start = isoDate.replace(/-/g, '');
    const d = new Date(isoDate + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    const end = d.toISOString().split('T')[0].replace(/-/g, '');
    const cleanActivity = activity.replace(/[\u{1F000}-\u{1FFFF}☀-➿]/gu, '').trim();
    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: 'Our date 💕 — ' + cleanActivity,
      dates: start + '/' + end,
      details: "Our cute little plan: " + cleanActivity + ". Can't wait! 🥹",
    });
    // When a valid guest email is supplied, Google invites them on save.
    if (email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      params.set('add', email);
    }
    return 'https://calendar.google.com/calendar/render?' + params.toString();
  }

  /* ---------- floating hearts ---------- */
  const heartLayer = document.getElementById('hearts');
  const HEARTS = ['💕','💖','💗','💞','🌸','✨','💘'];
  function burstHearts(count) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement('div');
      el.className = 'fh';
      el.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.bottom = '-30px';
      el.style.fontSize = (16 + Math.random() * 22) + 'px';
      const dur = 2.5 + Math.random() * 2.5;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = (Math.random() * 0.6) + 's';
      heartLayer.appendChild(el);
      setTimeout(() => el.remove(), (dur + 1) * 1000);
    }
  }
</script>
</body>
</html>
